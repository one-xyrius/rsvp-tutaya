name: Deploy to Cloudflare Pages

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Install python3-nacl (for encrypting secrets)
      - name: Install python3-nacl
        run: pip install pynacl

      # Set GitHub Secrets (Cloudflare + Supabase)
      - name: Set GitHub Secrets
        run: |
          python3 - <<'EOF'
          import base64, json, os
          from nacl import encoding, public
          import requests

          def encrypt(public_key: str, secret_value: str) -> str:
              public_key = public.PublicKey(public_key.encode('utf-8'), encoding.Base64Encoder())
              sealed_box = public.SealedBox(public_key)
              encrypted = sealed_box.encrypt(secret_value.encode('utf-8'))
              return base64.b64encode(encrypted).decode('utf-8')

          # GitHub API setup
          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GITHUB_TOKEN']
          url = f"https://api.github.com/repos/{repo}/actions/secrets/public-key"
          headers = {"Authorization": f"token {token}", "Accept": "application/vnd.github+json"}

          # Get GitHub public key
          response = requests.get(url, headers=headers)
          key_data = response.json()
          key_id = key_data["key_id"]
          key = key_data["key"]

          # Secrets to set
          secrets = {
            "CLOUDFLARE_ACCOUNT_ID": os.environ.get("CLOUDFLARE_ACCOUNT_ID", ""),
            "CLOUDFLARE_API_TOKEN": os.environ.get("CLOUDFLARE_API_TOKEN", ""),
            "SUPABASE_URL": "https://sshqcpixqykvnskqokzg.supabase.co",
            "SUPABASE_ANON_KEY": "sb_publishable_1VG3IFW8foDEalKgmGH0aQ_AlGiLSXC"
          }

          # Set secrets via GitHub API
          for name, value in secrets.items():
            if not value:
              print(f"⚠️ {name} is empty, skipping...")
              continue
            encrypted_value = encrypt(key, value)
            url = f"https://api.github.com/repos/{repo}/actions/secrets/{name}"
            data = {"encrypted_value": encrypted_value, "key_id": key_id}
            response = requests.put(url, headers=headers, json=data)
            if response.status_code in (201, 204):
              print(f"✅ {name} set successfully")
            else:
              print(f"❌ Failed to set {name}: {response.text}")
          EOF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # Deploy to Cloudflare Pages
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./out --project-name=rsvp-tutaya